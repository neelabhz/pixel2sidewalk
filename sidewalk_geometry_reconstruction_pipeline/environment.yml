name: pixel2sidewalk
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
  - numpy
  - pandas
  - geopandas
  - shapely
  - pyproj
  - opencv
  - pillow
  - tqdm
  - requests
  - pip
  - pip:
    - -e git+https://github.com/facebookresearch/detectron2.git@v0.6#egg=detectron2
    - gsplat
